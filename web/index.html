<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catatan Uang</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="login-view" class="login-wrap">
  <form id="login-form" class="card login-card">
    <h1>💰 Catatan Uang</h1>
    <p class="muted">Masuk untuk mengelola keuanganmu</p>
    <label>Username<input id="username" autocomplete="username" required /></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
    <button type="submit" class="btn primary">Masuk</button>
  </form>
</div>

<!-- APP -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand">💰 Catatan Uang</div>
    <nav>
      <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
      <button class="nav-btn" data-tab="transaksi">Transaksi</button>
      <button class="nav-btn" data-tab="tambah">+ Tambah</button>
    </nav>
    <button id="logout-btn" class="btn ghost">Keluar</button>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab">
      <div class="row">
        <label class="inline">Bulan <input type="month" id="dash-month" /></label>
      </div>
      <div class="stats">
        <div class="card stat in"><span class="label">Pemasukan</span><span class="value" id="stat-in">Rp0</span></div>
        <div class="card stat out"><span class="label">Pengeluaran</span><span class="value" id="stat-out">Rp0</span></div>
        <div class="card stat balance"><span class="label">Saldo Bulan Ini</span><span class="value" id="stat-balance">Rp0</span></div>
      </div>
      <div class="card">
        <h3>Arus Kas Harian</h3>
        <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Per Kategori</h3><div id="cat-list"></div></div>
        <div class="card"><h3>Transaksi Terakhir</h3><div id="recent-list"></div></div>
      </div>
    </section>

    <!-- TRANSAKSI -->
    <section id="tab-transaksi" class="tab" hidden>
      <div class="card filters">
        <input type="date" id="f-from" />
        <span class="muted">s/d</span>
        <input type="date" id="f-to" />
        <select id="f-type">
          <option value="">Semua</option>
          <option value="in">Masuk</option>
          <option value="out">Keluar</option>
        </select>
        <select id="f-cat"><option value="">Semua kategori</option></select>
        <input id="f-q" placeholder="Cari catatan..." />
        <button id="f-apply" class="btn primary">Tampilkan</button>
        <button id="f-export" class="btn">Export CSV</button>
      </div>
      <div class="card"><div id="tx-list"></div></div>
    </section>

    <!-- TAMBAH -->
    <section id="tab-tambah" class="tab" hidden>
      <form id="tx-form" class="card form-card">
        <h3 id="form-title">Tambah Transaksi</h3>
        <div class="type-toggle">
          <button type="button" id="type-out" class="toggle active">💸 Keluar</button>
          <button type="button" id="type-in" class="toggle">💰 Masuk</button>
        </div>
        <label>Tanggal<input type="date" id="tx-date" required /></label>
        <label>Kategori<select id="tx-category"></select></label>
        <label>Nominal (Rp)<input id="tx-amount" inputmode="numeric" placeholder="0" required /></label>
        <label>Catatan<input id="tx-note" placeholder="cth: makan siang" /></label>
        <label>Foto struk (opsional)<input type="file" id="tx-file" accept="image/*" /></label>
        <div class="row">
          <button type="submit" class="btn primary" id="tx-submit">Simpan</button>
          <button type="button" class="btn ghost" id="tx-cancel" hidden>Batal</button>
        </div>
      </form>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
