name: 🚀 Deploy uang-tracker to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "worker/**"
      - "web/**"
  workflow_dispatch:

jobs:
  deploy:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'uang-tracker' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "./worker/pnpm-lock.yaml"

      - name: 📦 Install dependencies
        working-directory: ./worker
        run: pnpm install --frozen-lockfile

      - name: 📡 Disable wrangler telemetry
        working-directory: ./worker
        run: pnpm wrangler telemetry disable

      - name: 🛠️ Set up environment
        working-directory: ./worker
        run: |
          echo "🔐 Menyiapkan environment..."

          if [ -z "$JWT_SECRET" ] || grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
            echo "❌ JWT_SECRET kosong atau mengandung karakter terlarang (?, %, #, /, \\)."
            echo "   (Dipakai di URL /api/init, jadi karakter itu akan merusak URL.)"
            exit 1
          fi
          [ -n "$ADMIN_USERNAME" ] || { echo "❌ ADMIN_USERNAME kosong."; exit 1; }
          [ -n "$ADMIN_PASSWORD" ] || { echo "❌ ADMIN_PASSWORD kosong."; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "❌ CLOUDFLARE_ACCOUNT_ID kosong."; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "❌ CLOUDFLARE_API_TOKEN kosong."; exit 1; }

          [ -n "$TELEGRAM_BOT_TOKEN" ] || echo "::warning:: TELEGRAM_BOT_TOKEN kosong — notif Telegram nonaktif."
          [ -n "$TELEGRAM_CHAT_ID" ] || echo "::warning:: TELEGRAM_CHAT_ID kosong — notif Telegram nonaktif."
          CONFIG_FILE="wrangler-action.toml"

          # Escape karakter spesial sed (| & \) pada nilai secret
          esc() { printf '%s' "$1" | sed -e 's/[|&\\]/\\&/g'; }

          sed -i "s|\${NAME}|$(esc "$NAME")|g" "$CONFIG_FILE"
          sed -i "s|\${JWT_SECRET}|$(esc "$JWT_SECRET")|g" "$CONFIG_FILE"
          sed -i "s|\${ADMIN_USERNAME}|$(esc "$ADMIN_USERNAME")|g" "$CONFIG_FILE"
          sed -i "s|\${ADMIN_PASSWORD}|$(esc "$ADMIN_PASSWORD")|g" "$CONFIG_FILE"
          sed -i "s|\${TELEGRAM_BOT_TOKEN}|$(esc "$TELEGRAM_BOT_TOKEN")|g" "$CONFIG_FILE"
          sed -i "s|\${TELEGRAM_CHAT_ID}|$(esc "$TELEGRAM_CHAT_ID")|g" "$CONFIG_FILE"

          echo "✅ Environment siap."

      - name: ⚙️ Set up KV namespace
        working-directory: ./worker
        run: |
          CONFIG_FILE="wrangler-action.toml"

          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|\${KV_NAMESPACE_ID}|$KV_NAMESPACE_ID|g" "$CONFIG_FILE"
            echo "✅ Memakai KV dari secrets."
            exit 0
          fi

          echo "🔍 Mengecek KV namespace..."
          KV_TITLE="$NAME-receipts"

          # Pastikan API KV bisa diakses (token valid) sebelum lanjut
          set +e
            PROBE=$(pnpm wrangler kv namespace list 2>&1)
            PROBE_STATUS=$?
          set -e
          if [ $PROBE_STATUS -ne 0 ]; then
            echo "$PROBE"
            echo "❌ Gagal mengakses KV API — cek CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          # Cari ID namespace berdasarkan title
          find_kv_id() {
            pnpm wrangler kv namespace list 2>/dev/null \
              | jq -r ".[] | select(.title == \"$KV_TITLE\") | .id" 2>/dev/null \
              | head -n 1
          }

          KV_ID=$(find_kv_id)

          if [ -n "$KV_ID" ]; then
            echo "✅ KV namespace $KV_TITLE sudah ada."
          else
            echo "⚠️ KV namespace $KV_TITLE belum ada, membuat baru..."
            CREATE_OUT=$(pnpm wrangler kv namespace create "$KV_TITLE" 2>&1)
            echo "$CREATE_OUT"
            # ID paling akurat ada di output create itu sendiri
            KV_ID=$(printf '%s' "$CREATE_OUT" | grep -oE '"id"[[:space:]]*:[[:space:]]*"[a-f0-9]{32}"' | head -n 1 | grep -oE '[a-f0-9]{32}' || true)
            # Fallback: baca ulang dari list (tunggu propagasi API bila perlu)
            if [ -z "$KV_ID" ]; then
              for i in 1 2 3; do
                sleep 5
                KV_ID=$(find_kv_id)
                [ -n "$KV_ID" ] && break
              done
            fi
          fi

          # JANGAN PERNAH sed dengan ID kosong — fail fast dengan pesan jelas
          if [ -z "$KV_ID" ]; then
            echo "❌ Gagal mendapatkan ID KV namespace \"$KV_TITLE\"."
            echo "   Solusi cepat: buat/cek manual di dash.cloudflare.com → Workers & Pages → KV,"
            echo "   lalu isi secret KV_NAMESPACE_ID dengan ID-nya dan re-run workflow."
            exit 1
          fi

          sed -i "s|\${KV_NAMESPACE_ID}|$KV_ID|g" "$CONFIG_FILE"
          echo "✅ KV siap: $KV_ID"

      - name: 🐬 Set up D1 database
        working-directory: ./worker
        run: |
          CONFIG_FILE="wrangler-action.toml"

          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s|\${D1_DATABASE_ID}|$D1_DATABASE_ID|g" "$CONFIG_FILE"
            echo "✅ Memakai D1 dari secrets."
            exit 0
          fi

          echo "🔍 Mengecek database D1..."

          set +e
            DB_LIST=$(pnpm wrangler d1 list --json 2>&1)
            STATUS=$?
          set -e

          if [ $STATUS -ne 0 ]; then
            echo "$DB_LIST"
            exit 1
          fi

          if echo "$DB_LIST" | jq -e ".[] | select(.name == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME sudah ada."
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
          else
            echo "⚠️ Database $NAME belum ada, membuat baru..."
            pnpm wrangler d1 create "$NAME"
            DB_LIST=$(pnpm wrangler d1 list --json)
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
          fi

          # JANGAN PERNAH sed dengan ID kosong — fail fast dengan pesan jelas
          if [ -z "$D1_ID" ]; then
            echo "❌ Gagal mendapatkan D1 database ID."
            exit 1
          fi

          sed -i "s|\${D1_DATABASE_ID}|$D1_ID|g" "$CONFIG_FILE"
          echo "✅ D1 siap: $D1_ID"

      - name: 🔎 Validasi konfigurasi akhir
        working-directory: ./worker
        run: |
          # Safety net: pastikan tidak ada placeholder ${...} yang belum terisi.
          # Kalau ada yang lolos, gagalkan di sini dengan pesan jelas —
          # jangan sampai deploy dengan config rusak seperti kasus id kosong.
          if grep -qE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' wrangler-action.toml; then
            echo "❌ Masih ada placeholder yang belum terisi di wrangler-action.toml:"
            grep -nE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' wrangler-action.toml || true
            exit 1
          fi
          echo "✅ Semua placeholder terisi, siap deploy."

      - name: 🚀 Deploy ke Cloudflare Workers
        id: deploy
        working-directory: ./worker
        run: |
          echo "🚀 Memulai deploy..."
          pnpm wrangler deploy -c wrangler-action.toml 2>&1 \
            | tee deploy.log \
            | grep -v "https://.*\.workers\.dev" \
            || true

          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "❌ Deploy gagal."
            exit 1
          fi

          WORKER_URL=$(grep -o "https://.*\.workers\.dev" deploy.log | head -n 1 || echo "")

          if [ -n "$WORKER_URL" ]; then
            echo "::add-mask::$WORKER_URL"
            echo "🌐 URL: $WORKER_URL"
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deploy selesai."

      - name: ♻️ Inisialisasi database
        run: |
          echo "🛠️ Inisialisasi database..."
          sleep 15

          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"

          if [ -z "$WORKER_URL" ]; then
            echo "❌ URL worker tidak ditemukan."
            exit 1
          fi

          BODY=$(curl -sL -w "\n%{http_code}" "$WORKER_URL/api/init/${JWT_SECRET}")
          HTTP_CODE=$(echo "$BODY" | tail -n 1)
          RESP=$(echo "$BODY" | head -n -1)

          if [ "$RESP" = "success" ]; then
            echo "✅ Database siap dipakai."
          else
            echo "❌ Gagal. HTTP: $HTTP_CODE, Respon: $RESP"
            exit 1
          fi
