# TEMPLATE — placeholder ${...} diganti dari GitHub Secrets oleh workflow deploy.
# Jangan isi nilai asli di sini.
#
# PENTING: secret (JWT_SECRET, ADMIN_*, TELEGRAM_*) TIDAK ditaruh di [vars]
# supaya tidak tersimpan sebagai plaintext di dashboard Cloudflare.
# Workflow mengirimnya via `wrangler secret bulk` (terenkripsi, tak bisa
# dibaca balik). Untuk dev lokal, pakai file .dev.vars (sudah di .gitignore).

name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Pengingat hutang harian: 01:00 UTC = 08:00 WIB
[triggers]
crons = ["0 1 * * *"]

[assets]
directory = "../web"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "${NAME}"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "RECEIPTS"
id = "${KV_NAMESPACE_ID}"

# Workers AI — dipakai fitur scan struk (vision)
[ai]
binding = "AI"
